[package]
name = "concord-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "JSON-RPC 2.0 server for Concord: dispatch, cancellation and credit-based streams"
repository.workspace = true

[lib]
doctest = false

[dependencies]
concord-api = { workspace = true }
concord-common = { workspace = true }
concord-proto = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
