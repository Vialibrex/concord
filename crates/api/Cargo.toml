[package]
name = "concord-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The typed control surface of Concord: one async function per protocol method"
repository.workspace = true

[lib]
doctest = false

[features]
# Answers `debug.crash`, which aborts the process; release packages leave it out.
debug = []

[dependencies]
concord-common = { workspace = true, features = ["io"] }
concord-engine = { workspace = true, features = ["mitm"] }
concord-proto = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
futures-util = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
concord-test-support = { workspace = true }
concord-platform = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
