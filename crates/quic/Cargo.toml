[package]
name = "concord-quic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "QUIC sockets, congestion control and connections for Concord's QUIC outbounds"
repository.workspace = true

[lib]
doctest = false

[dependencies]
concord-common = { workspace = true, features = ["io"] }
tokio = { workspace = true, features = ["time", "io-util", "macros", "rt", "sync"] }
futures-util = { workspace = true }
bytes = { workspace = true }
quinn = { workspace = true }
quinn-proto = { workspace = true }
rand = { workspace = true }
blake2 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
hex = { workspace = true }

[lints]
workspace = true
