#!name=Sample rewrites
#!desc=A Quantumult X configuration on reserved hosts.

[filter_local]
host, track.a.test, reject
host-suffix, ads.a.test, reject
host-keyword, -promo-, reject
ip-cidr, 198.51.100.0/24, reject
user-agent, SampleAgent*, reject

[rewrite_local]
^https?:\/\/api\.a\.test\/v1\/promo url reject-dict
^https?:\/\/api\.a\.test\/v1\/feed url script-response-body https://cdn.example.com/response.js

[task_local]
0 8 * * * https://cdn.example.com/cron.js, tag=Sample cron, enabled=true
event-network https://cdn.example.com/network.js, tag=Sample network

[http_backend]
https://cdn.example.com/backend.js, host=backend.a.test, tag=Sample backend, path=^/, enabled=true

[server_local]
shadowsocks=192.0.2.20:8388, method=aes-128-gcm, password=sample, tag=Sample

[policy]
static=Sample, direct, reject

[mitm]
hostname = api.a.test, *.cdn.a.test
skip_validating_cert = true
