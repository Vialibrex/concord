name: audit

# New RustSec advisories arrive without a commit here, so the dependency check also runs weekly; `ci` runs the full
# `cargo deny check` on every change.
on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yaml
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories
        run: cargo deny check advisories
